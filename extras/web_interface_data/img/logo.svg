<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Dark, modern tech background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Neon gradient for radio waves -->
    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border for glassmorphism -->
  <rect x="2" y="2" width="252" height="252" rx="46" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Signal Waves -->
  <g fill="none" stroke="url(#neonGrad)" stroke-linecap="round" filter="url(#glow)">
    <path d="M 128,40 A 60 60 0 0 1 188,100" stroke-width="8" />
    <path d="M 128,60 A 40 40 0 0 1 168,100" stroke-width="8" />
    <circle cx="128" cy="100" r="8" fill="url(#neonGrad)" stroke="none" />
  </g>

  <!-- House Outline -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
    <path d="M 128,80 L 60,135 L 60,190 C 60,195 65,200 70,200 L 186,200 C 191,200 196,195 196,190 L 196,135 Z" />
    <path d="M 40,150 L 128,80 L 216,150" stroke-width="12" />
  </g>

  <!-- IO integrated in house -->
  <g fill="#ffffff" filter="url(#subtleGlow)">
    <!-- I -->
    <rect x="95" y="130" width="12" height="40" rx="6" />
    <!-- O -->
    <path fill-rule="evenodd" d="M 140,130 C 128,130 120,139 120,150 C 120,161 128,170 140,170 C 152,170 160,161 160,150 C 160,139 152,130 140,130 Z M 140,140 C 145,140 148,144 148,150 C 148,156 145,160 140,160 C 135,160 132,156 132,150 C 132,144 135,140 140,140 Z" />
  </g>

  <!-- Omni-IO Text -->
  <text x="128" y="235" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="2"
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#subtleGlow)">OMNI-IO</text>
</svg>
