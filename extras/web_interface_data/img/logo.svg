<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Deep tech background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Neon gradient for smart blinds -->
    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="252" height="252" rx="46" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

  <!-- The Sun -->
  <circle cx="128" cy="115" r="48" fill="url(#sunGrad)" filter="url(#glow)" />
  
  <!-- Sun Rays (bursting outwards) -->
  <g stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <!-- 180 deg (Left) -->
    <line x1="72" y1="115" x2="56" y2="115" />
    <!-- 150 deg -->
    <line x1="80" y1="87" x2="66" y2="79" />
    <!-- 120 deg -->
    <line x1="100" y1="67" x2="92" y2="53" />
    <!-- 90 deg (Top) -->
    <line x1="128" y1="59" x2="128" y2="43" />
    <!-- 60 deg -->
    <line x1="156" y1="67" x2="164" y2="53" />
    <!-- 30 deg -->
    <line x1="176" y1="87" x2="190" y2="79" />
    <!-- 0 deg (Right) -->
    <line x1="184" y1="115" x2="200" y2="115" />
  </g>

  <!-- Radio Waves (Negative space inside the sun) -->
  <g fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round">
    <!-- Center Node -->
    <circle cx="128" cy="116" r="4.5" fill="#0f172a" stroke="none" />
    <!-- Wi-Fi Arcs -->
    <path d="M 117 104 A 15 15 0 0 1 139 104" />
    <path d="M 108 95 A 28 28 0 0 1 148 95" />
    <path d="M 99 86 A 41 41 0 0 1 157 86" />
  </g>

  <!-- Smart Blinds / Zonnewering (halfway closed) -->
  <g filter="url(#subtleGlow)">
    <!-- Slats covering the lower half of the sun -->
    <rect x="68" y="115" width="120" height="8" rx="4" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="1.5" />
    <rect x="68" y="130" width="120" height="8" rx="4" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="1.5" />
    <rect x="68" y="145" width="120" height="8" rx="4" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="1.5" />
    <rect x="68" y="160" width="120" height="8" rx="4" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="1.5" />
    
    <!-- Bottom weight bar -->
    <rect x="63" y="175" width="130" height="10" rx="5" fill="url(#neonGrad)" />
  </g>

  <!-- Omni-IO Text -->
  <text x="128" y="230" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="3"
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#subtleGlow)">OMNI-IO</text>
</svg>
