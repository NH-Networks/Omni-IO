name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO and esptool
        run: pip install -U platformio esptool

      - name: Generate release tag
        id: generate_release_tag
        uses: alexvingg/next-release-tag@v1.0.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ''

      - name: Build PlatformIO project
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run -e LilyGoLoraESP32 -e HeltecLoraV2ESP32 -e LilyGoT3S3 -e LilyGoTBeamV12ESP32

      - name: Build filesystem
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run -e LilyGoLoraESP32 -e HeltecLoraV2ESP32 -e LilyGoT3S3 -e LilyGoTBeamV12ESP32 -t buildfs

      - name: Merge bin files together for LilyGoLoraESP32
        run: esptool --chip esp32 merge-bin -o LilyGoLoraESP32.bin --flash-size 4MB 0x1000 .pio/build/LilyGoLoraESP32/bootloader.bin 0x8000 .pio/build/LilyGoLoraESP32/partitions.bin 0x10000 .pio/build/LilyGoLoraESP32/firmware.bin 0x390000 .pio/build/LilyGoLoraESP32/littlefs.bin

      - name: Merge bin files together for HeltecLoraV2ESP32
        run: esptool --chip esp32 merge-bin -o HeltecLoraV2ESP32.bin --flash-size 8MB 0x1000 .pio/build/HeltecLoraV2ESP32/bootloader.bin 0x8000 .pio/build/HeltecLoraV2ESP32/partitions.bin 0x10000 .pio/build/HeltecLoraV2ESP32/firmware.bin 0x670000 .pio/build/HeltecLoraV2ESP32/littlefs.bin

      - name: Merge bin files together for LilyGoT3S3
        run: esptool --chip esp32s3 merge-bin -o LilyGoT3S3.bin --flash-size 4MB 0x0 .pio/build/LilyGoT3S3/bootloader.bin 0x8000 .pio/build/LilyGoT3S3/partitions.bin 0x10000 .pio/build/LilyGoT3S3/firmware.bin 0x390000 .pio/build/LilyGoT3S3/littlefs.bin

      - name: Merge bin files together for LilyGoTBeamV12ESP32
        run: esptool --chip esp32 merge-bin -o LilyGoTBeamV12ESP32.bin --flash-size 4MB 0x1000 .pio/build/LilyGoTBeamV12ESP32/bootloader.bin 0x8000 .pio/build/LilyGoTBeamV12ESP32/partitions.bin 0x10000 .pio/build/LilyGoTBeamV12ESP32/firmware.bin 0x390000 .pio/build/LilyGoTBeamV12ESP32/littlefs.bin

      - name: Prepare firmware and littlefs files for release
        run: |
          mv .pio/build/LilyGoLoraESP32/firmware.bin LilyGoLoraESP32_firmware.bin
          mv .pio/build/LilyGoLoraESP32/littlefs.bin LilyGoLoraESP32_filesystem.bin
          mv .pio/build/HeltecLoraV2ESP32/firmware.bin HeltecLoraV2ESP32_firmware.bin
          mv .pio/build/HeltecLoraV2ESP32/littlefs.bin HeltecLoraV2ESP32_filesystem.bin
          mv .pio/build/LilyGoT3S3/firmware.bin LilyGoT3S3_firmware.bin
          mv .pio/build/LilyGoT3S3/littlefs.bin LilyGoT3S3_filesystem.bin
          mv .pio/build/LilyGoTBeamV12ESP32/firmware.bin LilyGoTBeamV12ESP32_firmware.bin
          mv .pio/build/LilyGoTBeamV12ESP32/littlefs.bin LilyGoTBeamV12ESP32_filesystem.bin

      - name: Generate release notes
        run: |
          cat > changelog.md <<EOF
          # 🎉 Omni-IO Release ${{ github.ref_name }}

          Welcome to the **${{ github.ref_name }}** release of **Omni-IO**, the next-generation open-source ESP32 gateway and controller for **io-homecontrol®** (868.95 MHz) devices (Somfy, Velux, and compatible HVAC/blinds systems).

          ---

          ## ✨ What's New in ${{ github.ref_name }}

          * 🏠 **Device Room Grouping with Master Controls**:
            * Group devices into customizable rooms and zones with quick sorting.
            * Master Room Controls allowing one-click Open, Close, Stop, and Vent across all devices in a room.
            * Visual real-time position sync across room members.
          * 📡 **Live MQTT Status Indicator & Health Monitoring**:
            * Header status badge showing real-time MQTT broker connectivity and connection status.
          * 🎬 **Real-Time Motion Animation & WebSocket Sync**:
            * Real-time rolling/tilting animations during motor movement.
            * Motion completion synchronization across connected WebSocket clients with auto-clearing motion state.
          * ⚡ **Performance & UI Refinements**:
            * GPU hardware acceleration hints and smooth scrolling for a seamless mobile & desktop experience.
            * Interactive logo click navigation back to primary Devices view.
            * Visual polish and hover improvements.

          ---

          ## 🌟 Acknowledgments & Credits

          Omni-IO is built with deep gratitude and respect for the pioneering work of the open-source community:

          * **[Velocet](https://github.com/Velocet)** — Author of [Velocet/iown-homecontrol](https://github.com/Velocet/iown-homecontrol): Reverse engineering of the io-homecontrol protocol, CRC calculations, and AES cryptography implementations.
          * **[cridp](https://github.com/cridp)** — Author of [cridp/iown-homecontrol-esp32sx1276](https://github.com/cridp/iown-homecontrol-esp32sx1276): ESP32 and Semtech SX1276 hardware adaptation.
          * **[djbenbe](https://github.com/djbenbe)** — Author of [djbenbe/miopen.io](https://github.com/djbenbe/miopen.io/tree/Beta): Core firmware development, UI concept, graphics, and initial integration.
          * **[rspaargaren](https://github.com/rspaargaren)** — Community documentation, guides, and [io-homecontrol Wiki](https://github.com/rspaargaren/iohomecontrol/wiki).
          * **[CloudAXS](https://github.com/CloudAXS)** — Web interface architecture, modern responsive UI, and multi-language engine.

          ---

          ## 📚 Complete Guides & Documentation

          Comprehensive documentation has been published in the repository:
          * 🔌 **[Hardware Setup & Pinouts](docs/HARDWARE_SETUP.md)**: Board comparison, SPI pinouts, antenna specifications, and wiring diagrams.
          * 🔄 **[Pairing & Calibration Guide](docs/PAIRING_GUIDE.md)**: Motor pairing sequence, travel time calibration, and wall remote mapping.
          * 🏠 **[Home Assistant Integration](docs/HOME_ASSISTANT.md)**: Zero-config MQTT discovery, dashboard cards, and automation examples.
          * 🌐 **[REST API & MQTT Reference](docs/API_AND_MQTT_REFERENCE.md)**: Complete endpoint documentation and WebSocket event specifications.
          * 🔧 **[Troubleshooting Guide](docs/TROUBLESHOOTING.md)**: Solutions for WiFi, mDNS, RF range, and OLED screen issues.
          * 💻 **[Terminal & Serial Commands](COMMANDS.md)**: Interactive command reference.

          ---

          ## 🛠️ Supported Hardware & Included Files

          | Board | Merged Single-File Flash (\`*.bin\`) | OTA Firmware (\`*_firmware.bin\`) | Filesystem (\`*_filesystem.bin\`) |
          | :--- | :--- | :--- | :--- |
          | **LilyGo T-Beam v1.2** | \`LilyGoTBeamV12ESP32.bin\` | \`LilyGoTBeamV12ESP32_firmware.bin\` | \`LilyGoTBeamV12ESP32_filesystem.bin\` |
          | **LilyGo LoRa32 v2.1** | \`LilyGoLoraESP32.bin\` | \`LilyGoLoraESP32_firmware.bin\` | \`LilyGoLoraESP32_filesystem.bin\` |
          | **Heltec LoRa32 v2** | \`HeltecLoraV2ESP32.bin\` | \`HeltecLoraV2ESP32_firmware.bin\` | \`HeltecLoraV2ESP32_filesystem.bin\` |
          | **LilyGo T3-S3** | \`LilyGoT3S3.bin\` | \`LilyGoT3S3_firmware.bin\` | \`LilyGoT3S3_filesystem.bin\` |

          ---

          ### 📦 Flashing Instructions
          * **First-time Flash**: Use [ESP Web Tools](https://esphome.github.io/esp-web-tools/) or \`esptool.py\` with the combined \`.bin\` file.
          * **Web OTA Update**: Upload the \`*_firmware.bin\` and \`*_filesystem.bin\` files directly in the Web UI under **Settings → Firmware Update**.
          EOF

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          body_path: changelog.md
          prerelease: ${{ !startsWith(github.ref_name, 'v') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          files: |
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin
            LilyGoT3S3.bin
            LilyGoT3S3_firmware.bin
            LilyGoT3S3_filesystem.bin
            LilyGoTBeamV12ESP32.bin
            LilyGoTBeamV12ESP32_firmware.bin
            LilyGoTBeamV12ESP32_filesystem.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin
            LilyGoT3S3.bin
            LilyGoT3S3_firmware.bin
            LilyGoT3S3_filesystem.bin
            LilyGoTBeamV12ESP32.bin
            LilyGoTBeamV12ESP32_firmware.bin
            LilyGoTBeamV12ESP32_filesystem.bin
            changelog.md
