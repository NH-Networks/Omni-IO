name: Branch Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev-main
      - Beta

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - HeltecLoraV2ESP32
          - LilyGoTBeamV12ESP32
          - LilyGoLoraESP32
          - LilyGoT3S3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Build filesystem
        run: pio run -e ${{ matrix.env }} -t buildfs

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/${{ matrix.env }}_${{ github.ref_name }}_${{ github.sha }}_firmware.bin
          cp .pio/build/${{ matrix.env }}/littlefs.bin artifacts/${{ matrix.env }}_${{ github.ref_name }}_${{ github.sha }}_filesystem.bin
          cat > artifacts/${{ matrix.env }}_${{ github.ref_name }}_${{ github.sha }}_info.json <<EOF
          {
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "environment": "${{ matrix.env }}"
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          Automated branch build for `${{ github.ref_name }}`.

          Commit: `${{ github.sha }}`

          Included files:
          - Firmware binaries
          - Filesystem binaries
          - Build info JSON per board
          EOF

      - name: Publish branch release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}-latest
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }} latest build
          bodyFile: release-notes.md
          artifacts: release-artifacts/*
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          prerelease: ${{ github.ref_name != 'master' }}